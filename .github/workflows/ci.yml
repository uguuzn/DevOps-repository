name: CI Backend

on:
  push:
    branches:
      - main
      - "devops/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
          cache: maven

      - name: Executar testes
        working-directory: backend
        run: mvn test